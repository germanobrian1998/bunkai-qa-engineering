name: Static Checks
run-name: ${{ github.actor }} triggered Static Checks on ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-plan:
    name: static-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      checks: ${{ steps.list.outputs.checks }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts --production

      - name: List the ci checks of the contract
        id: list
        env:
          EDD_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: echo "checks=$(bun scripts/edd.ts check --list)" >> "$GITHUB_OUTPUT"

  static:
    name: ${{ matrix.check }}
    needs: static-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.static-plan.outputs.checks) }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Create the gitignored harness aliases
        run: bun run agents:compat

      - name: Run the check
        env:
          CHECK: ${{ matrix.check }}
          EDD_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/edd.ts check "$CHECK"
